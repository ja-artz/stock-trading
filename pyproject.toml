[project]
name = "stock-trading"
version = "0.1.0"
description = "Automated stock and options trading recommendation system based on news analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "anthropic>=0.34.0",
    "openai>=1.54.0",
    "openai-agents>=0.1.0",
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.8.2",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "yfinance>=0.2.40",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "*.py",
    "core",
    "pipeline",
    "api",
    "jobs",
    "scripts",
    "README.md",
    "LICENSE"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
extraPaths = [".venv/Lib/site-packages"]
